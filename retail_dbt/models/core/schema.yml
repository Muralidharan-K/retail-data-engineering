version: 2

models:

  - name: dim_customer

    columns:

      - name: customer_key
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - unique


  - name: dim_product

    columns:

      - name: product_key
        tests:
          - not_null
          - unique

      - name: product_id
        tests:
          - not_null
          - unique


  - name: dim_store

    columns:

      - name: store_key
        tests:
          - not_null
          - unique

      - name: store_id
        tests:
          - not_null
          - unique


  - name: dim_date

    columns:

      - name: date_key
        tests:
          - not_null
          - unique

      - name: full_date
        tests:
          - not_null
          - unique


  - name: fact_sales

    columns:

      - name: sales_key
        tests:
          - not_null
          - unique

      - name: order_item_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: store_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key